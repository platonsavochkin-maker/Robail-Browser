<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4"/>
  
  <!-- Glowing Orbital Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#purple)" stroke-width="12" opacity="0.3" stroke-dasharray="24 16"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.5" filter="url(#glow)"/>
  
  <!-- Stylized Modern 'R' Monogram -->
  <path d="M 170 130 
           L 280 130 
           C 340 130, 375 165, 375 225 
           C 375 275, 340 305, 290 315 
           L 380 400 
           L 310 400 
           L 230 320 
           L 230 400 
           L 170 400 Z 
           M 230 185 
           L 230 270 
           L 275 270 
           C 305 270, 320 255, 320 227 
           C 320 200, 305 185, 275 185 Z" 
        fill="url(#gold)" 
        filter="url(#glow)"/>
        
  <!-- Core Sparkle Indicator -->
  <circle cx="375" cy="145" r="18" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="375" cy="145" r="9" fill="#ffffff"/>
</svg>
